<!doctype html>
<!--
  frontend/electron/launcher.html
  Start screen of the downloadable build (no command line when you double-click an .exe).
  It is a local file: it does no networking itself. "Connect" sends the choice to the main process
  (window.gameLauncher -> IPC), which then opens the real TCP or UDP socket and loads the game.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Among Us Arena</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #1d2b53 0%, #070b18 70%);
    color: #e8ecf5; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: min(520px, 92vw); background: rgba(13, 20, 42, 0.92); border: 1px solid #2c3a66;
    border-radius: 14px; padding: 28px 30px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 1px; }
  .sub { margin: 0 0 22px; color: #9aa6c4; }
  .protos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .proto {
    border: 2px solid #2c3a66; border-radius: 10px; padding: 12px 14px; cursor: pointer;
    background: #10193a; transition: border-color .15s, background .15s;
  }
  .proto input { display: none; }
  .proto b { display: block; font-size: 18px; }
  .proto span { color: #9aa6c4; font-size: 13px; }
  .proto.on { border-color: #4ecca3; background: #0f2a3a; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; font-size: 13px; color: #9aa6c4; margin-bottom: 4px; }
  .row { display: grid; grid-template-columns: 1fr 110px; gap: 10px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3a66;
    background: #070d22; color: #fff; font: 15px Consolas, "Courier New", monospace;
  }
  input:focus { outline: 2px solid #4ecca3; border-color: transparent; }
  .hint { font-size: 12.5px; color: #7f8bab; margin-top: 4px; }
  button {
    width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
    background: #e94560; color: #fff; font-size: 17px; font-weight: 600; letter-spacing: .5px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: #ff8a8a; min-height: 22px; margin-top: 10px; font-size: 14px; }
  #lossRow[hidden] { display: none; }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <h1>Among Us Arena</h1>
  <p class="sub">Choose the version of the game and the server to join.</p>

  <div class="protos">
    <label class="proto" id="tcpBox"><input type="radio" name="proto" value="tcp">
      <b>TCP version</b><span>reliability by the OS (port <span id="tcpPortLbl">5000</span>)</span></label>
    <label class="proto" id="udpBox"><input type="radio" name="proto" value="udp">
      <b>UDP version</b><span>our own reliability (port <span id="udpPortLbl">5001</span>)</span></label>
  </div>

  <label class="field"><span>Server address</span>
    <div class="row">
      <input type="text" id="server" placeholder="192.168.1.20" spellcheck="false">
      <input type="number" id="port" min="1" max="65535">
    </div>
    <div class="hint" id="serverHint">The IP shown on the download page of the server PC.</div>
  </label>

  <label class="field" id="lossRow" hidden><span>Simulated packet loss (UDP only, optional)</span>
    <input type="number" id="loss" min="0" max="90" step="5" value="0">
    <div class="hint">Drops this % of our datagrams on purpose, to watch retransmissions in the HUD. Keep 0 to play normally.</div>
  </label>

  <button type="submit" id="go">Connect</button>
  <div class="error" id="error"></div>
</form>

<script>
  const $ = (id) => document.getElementById(id);
  let ports = { tcp: 5000, udp: 5001 };

  function setProto(proto) {
    document.querySelector(`input[value=${proto}]`).checked = true;
    $('tcpBox').classList.toggle('on', proto === 'tcp');
    $('udpBox').classList.toggle('on', proto === 'udp');
    $('port').value = ports[proto];
    $('lossRow').hidden = proto !== 'udp';
  }
  document.querySelectorAll('input[name=proto]').forEach((r) => r.addEventListener('change', () => setProto(r.value)));

  window.gameLauncher.defaults().then((d) => {
    ports = { tcp: d.tcpPort, udp: d.udpPort };
    $('tcpPortLbl').textContent = d.tcpPort;
    $('udpPortLbl').textContent = d.udpPort;
    $('server').value = d.server;
    if (d.bundledServer) $('serverHint').textContent = `Pre-filled with the server this copy was downloaded from (${d.bundledServer}).`;
    setProto(d.proto);
    $('go').focus();
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').textContent = '';
    $('go').disabled = true;
    $('go').textContent = 'Connecting…';
    const proto = document.querySelector('input[name=proto]:checked').value;
    const res = await window.gameLauncher.start({
      proto,
      server: $('server').value,
      port: Number($('port').value),
      loss: proto === 'udp' ? Number($('loss').value || 0) / 100 : 0,
    });
    if (!res.ok) {   // on success the main process replaces this page with the game
      $('error').textContent = res.message;
      $('go').disabled = false;
      $('go').textContent = 'Connect';
    }
  });
</script>
</body>
</html>
